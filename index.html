<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JECSU Election 2026 — Jorhat Engineering College</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #D72638;
    --gold: #F4B942;
    --navy: #0B1120;
    --navy2: #111827;
    --slate: #1E2A40;
    --muted: #8A95A8;
    --light: #E8EDF5;
    --white: #F7F9FC;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
  }

  body.modal-open { overflow: hidden; }

  .mini-hero {
    padding: 5rem 1.5rem 3rem;
    text-align: center;
    background: var(--navy2);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }

  .mini-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(215,38,56,.1) 0%, transparent 60%);
    pointer-events: none;
  }

  .mini-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 10vw, 5.5rem);
    line-height: 1;
    letter-spacing: .03em;
    color: var(--white);
    margin-bottom: 1.2rem;
    animation: fadeDown .6s ease both;
    position: relative;
  }

  .mini-title span { color: var(--gold); }

  .lobby-text {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: .75rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--red);
    background: rgba(215,38,56,0.1);
    border: 1px solid rgba(215,38,56,0.2);
    padding: .5rem 1.2rem;
    border-radius: 4px;
    animation: fadeDown .6s .2s ease both;
    position: relative;
  }

  .section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 4rem 1.5rem;
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    line-height: 1;
    color: var(--white);
    margin-bottom: 2.5rem;
  }

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    margin-bottom: 2.5rem;
  }

  .filter-btn {
    font-family: 'Space Mono', monospace;
    font-size: .65rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: .45rem 1rem;
    border: 1px solid rgba(255,255,255,.15);
    background: transparent;
    color: var(--muted);
    border-radius: 2px;
    cursor: pointer;
    transition: var(--transition);
  }

  .filter-btn:hover,
  .filter-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(244,185,66,.07);
  }

  .candidates-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
  }

  .candidate-card {
    background: var(--navy2);
    border: 1px solid rgba(255,255,255,.06);
    padding: 1.5rem;
    transition: var(--transition);
    cursor: pointer;
    display: none;
    border-radius: 8px;
    overflow: hidden;
    animation: fadeUp .5s ease forwards;
  }

  .candidate-card.visible { display: block; }

  .candidate-card:hover {
    background: var(--slate);
    border-color: rgba(244,185,66,.4);
    transform: translateY(-4px);
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1rem;
  }

  .card-info { flex: 1; padding-right: 1rem; }

  .card-role {
    font-family: 'Space Mono', monospace;
    font-size: .58rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: .3rem;
  }

  .card-position { font-size: .78rem; color: var(--muted); }

  .card-photo-wrap {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.1);
    background: var(--slate);
    overflow: hidden;
    flex-shrink: 0;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .candidate-card:hover .card-photo-wrap { border-color: var(--gold); }

  .card-photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }

  .card-photo-wrap .initials {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    color: rgba(255,255,255,.25);
    letter-spacing: .05em;
    display: none;
  }

  .card-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: .04em;
    color: var(--white);
    line-height: 1.1;
    margin-bottom: .8rem;
  }

  .card-meta { display: flex; gap: .6rem; flex-wrap: wrap; }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: .6rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: .25rem .6rem;
    border-radius: 4px;
    background: rgba(255,255,255,.06);
    color: var(--muted);
  }

  .tag.sem { background: rgba(244,185,66,.1); color: var(--gold); }

  .click-hint {
    margin-top: 1rem;
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    opacity: 0.5;
    transition: var(--transition);
  }

  .candidate-card:hover .click-hint { opacity: 1; color: var(--gold); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(11, 17, 32, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .modal-overlay.active { opacity: 1; pointer-events: auto; }

  .modal-container {
    background: var(--navy2);
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    border-radius: 12px;
    border: 1px solid rgba(244,185,66,.2);
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
    overflow-y: auto;
    transform: translateY(30px) scale(0.95);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }

  .modal-overlay.active .modal-container { transform: translateY(0) scale(1); }

  .modal-container::-webkit-scrollbar { width: 6px; }
  .modal-container::-webkit-scrollbar-track { background: var(--navy2); }
  .modal-container::-webkit-scrollbar-thumb { background: var(--slate); border-radius: 10px; }

  .close-btn {
    position: absolute;
    top: 1.2rem;
    right: 1.2rem;
    background: rgba(255,255,255,0.1);
    border: none;
    color: var(--white);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.2rem;
    transition: var(--transition);
    z-index: 10;
  }

  .close-btn:hover { background: var(--red); transform: rotate(90deg); }

  .modal-header {
    padding: 2.5rem 2rem 1.5rem;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    background: linear-gradient(to bottom, rgba(30,42,64,0.5), transparent);
  }

  .modal-photo-wrap {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    margin: 0 auto 1.5rem;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    overflow: hidden;
    background: var(--slate);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }

  .modal-photo-wrap .initials {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    color: rgba(255,255,255,.2);
    letter-spacing: .05em;
    display: none;
  }

  .modal-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    letter-spacing: .02em;
    color: var(--white);
    line-height: 1;
    margin-bottom: 0.5rem;
  }

  .modal-position {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    color: var(--red);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .modal-tags { display: flex; justify-content: center; gap: 0.8rem; }

  .modal-body { padding: 2rem; }

  .agenda-title {
    display: flex;
    align-items: center;
    gap: 1rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    color: var(--gold);
    margin-bottom: 1.5rem;
    letter-spacing: 0.05em;
  }

  .agenda-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.1);
  }

  .agenda-content {
    color: rgba(255,255,255,0.85);
    line-height: 1.7;
    font-size: 0.95rem;
  }

  .agenda-content ul { list-style: none; margin-top: 1rem; }

  .agenda-content li {
    margin-bottom: 1rem;
    padding-left: 1.5rem;
    position: relative;
  }

  .agenda-content li::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--red);
    font-family: 'Space Mono', monospace;
  }

  footer {
    background: #080d17;
    padding: 2.5rem 1.5rem;
    text-align: center;
  }

  footer .f-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: .1em;
    color: var(--gold);
    margin-bottom: .3rem;
  }

  footer p { font-size: .78rem; color: var(--muted); letter-spacing: .05em; }

  .hostel-note {
    display: inline-block;
    margin-top: .8rem;
    font-family: 'Space Mono', monospace;
    font-size: .6rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(255,255,255,.25);
    border-top: 1px solid rgba(255,255,255,.08);
    padding-top: .8rem;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .candidates-grid { grid-template-columns: 1fr; }
    .modal-body { padding: 1.5rem; }
  }
</style>
</head>
<body>

<header class="mini-hero">
  <h1 class="mini-title">JECSU <span>Election</span> 2026</h1>
  <div class="lobby-text">Our Lobby: Hostels 3, 4, 5, 7, 8, 9</div>
</header>

<div class="section">
  <h2 class="section-title">Our Candidates</h2>
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="Mechanical">Mechanical</button>
    <button class="filter-btn" data-filter="Electrical">Electrical</button>
    <button class="filter-btn" data-filter="Civil">Civil</button>
    <button class="filter-btn" data-filter="Computer Sc &amp; Engg.">CSE</button>
    <button class="filter-btn" data-filter="Instrumentation">Instrumentation</button>
  </div>
  <div class="candidates-grid" id="grid"></div>
</div>

<footer>
  <div class="f-title">JECSU 2026</div>
  <p>Jorhat Engineering College &nbsp;·&nbsp; Jorhat-7, Assam</p>
  <div class="hostel-note">Lobby Display · Hostels 3, 4, 5, 7, 8, 9</div>
</footer>

<div class="modal-overlay" id="candidateModal">
  <div class="modal-container">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="modal-header">
      <div class="modal-photo-wrap" id="modalPhotoWrap"></div>
      <h2 class="modal-name" id="modalName"></h2>
      <div class="modal-position" id="modalPosition"></div>
      <div class="modal-tags">
        <span class="tag sem" id="modalSem"></span>
        <span class="tag" id="modalBranch"></span>
      </div>
    </div>
    <div class="modal-body">
      <div class="agenda-title">Manifesto &amp; Agenda</div>
      <div class="agenda-content" id="modalAgenda"></div>
    </div>
  </div>
</div>

<script>
/* ─ helpers ─ */
function photoSrc(firstName) {
  return 'images/' + firstName + '.jpg';
}

function getInitials(name) {
  return name.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
}

/*
  Builds the inside of a photo wrapper: an <img> that, if it 404s,
  hides itself and reveals the sibling initials <span>.
*/
function photoInner(firstName, fullName) {
  const ini = getInitials(fullName);
  return `<img src="${photoSrc(firstName)}" alt="${fullName}"
    style="width:100%;height:100%;object-fit:cover;object-position:top center;display:block"
    onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
  <span class="initials">${ini}</span>`;
}

/* ─ agendas ─ */
const agendas = {

  "Technical & Hobby Centre": [
    "Elevating the overall technical standard of our college.",
    "Establishing a \"Hobby Centre Fund\" for the students of JEC. It will provide financial support and equal opportunities for our students in different technical competitions, workshops, Hackathon at any level.",
    "Restoring the Techno cum Hobby Centre with improved infrastructure, better access to technical resources, and learning materials.",
    "To ensure a stronger collaboration among all the technical clubs through inter disciplinary projects, shared intiatives and regular hands on session.",
    "To make campus Wi-Fi more accessible and student friendly and provide institutional access to software such as CAD, simulations etc.",
    "Turning Technovus into a full fledged and prestigious technical fest of North-East India."
  ],
  "Girls' Common Room": [

    "Installing better facilities within the girls common room",
    "Installing more indoor games for girl students within the girls common room",
    "Utilising the girls common room as a space for musical and other activities",
    "Rebuilding the pad machine already installed in the girls common room."
  ],
  "Social Service & Welfare": [
    "Cleanliness & environmental drives.",
    "Blood donation camps.",
    "Women Safety Awareness",
    "Health & Hygienes campaigns",
    "Stress relief activities during exams",
    "Skill workshops",
    "Notes Sharing and study centrer"
  ],
  "Debating & Symposium": [
    "To collaborate with the Training and Placement Cell to organize sessions on soft skills, interview preparation, group discussions, resume communication, and professional etiquette for placements and career growth.",
    "To conduct mock interviews inspired by UPSC personality tests and PSU/company recruitment processes to help students develop confidence, clarity, and professional communication skills.",
    "To organize regular debating competitions throughout the academic year to build a vibrant, competitive, and intellectually active debating culture within the college.",
    "To introduce diverse communication-based events such as Group Discussions (GDs), Extempore, Mock Parliaments, Panel Discussions, JAM sessions, Presentations, and Public Speaking contests to help JECians become well-rounded communicators.",
    "To encourage participation of JECians in inter-college, state-level, and national-level debating and symposium competitions by providing mentorship and structured preparation sessions.",
    "To create a platform where students can openly discuss social, technical, national, and campus-related issues through healthy and constructive dialogue.",
    "To organize symposiums and technical speaking events that bridge communication skills with engineering, innovation, and leadership.",
    "To promote an inclusive and confident speaking culture where every JECian, regardless of experience, feels encouraged to express ideas and opinions freely.",
    "To conduct regular workshops and practice sessions to help JECians continuously improve their debating, public speaking, and communication skills.",
    "To organize masterclasses and interactive sessions with renowned speakers, alumni, professionals, and industry experts to expose JECIANS to real-world communication and leadership skills.",
    "To broaden the scope of the forum beyond debating by creating opportunities for JECians to regularly practice communication, critical thinking, and confidence-building activities."
  ]
};

function agendaHtml(type) {
  const list = agendas[type] || agendas["General"];
  return '<ul>' + list.map(i => `<li>${i}</li>`).join('') + '</ul>';
}

/* ─ candidates ─ */
const candidates = [
  { firstName:"bibhuti",    name:"Bibhuti Bhushan Tamuli",  portfolio:"General Secretary",                   position:"General Secretary",                    sem:6, branch:"Mechanical",          agendaType:"General Secretary" },
  { firstName:"darsan",     name:"Darsan Protim Baruah",    portfolio:"Asst. General Secretary",             position:"Asst. General Secretary",              sem:6, branch:"Electrical",           agendaType:"General Secretary" },

  { firstName:"debanga",    name:"Debanga Raj Munda",        portfolio:"Gymnasium Secretary",                 position:"Gymnasium Secretary",                  sem:6, branch:"Mechanical",          agendaType:"Gymnasium" },
  { firstName:"kallul",     name:"Kallul Saikia",            portfolio:"Major Games Secretary",               position:"Major Games Secretary",                sem:6, branch:"Mechanical",          agendaType:"Sports" },

  { firstName:"shobhitya",  name:"Shobhitya Raj Borah",     portfolio:"Technical & Hobby Centre Secretary",  position:"Technical & Hobby Centre Secretary",   sem:6, branch:"Mechanical",          agendaType:"Technical & Hobby Centre" },
  { firstName:"aghya",      name:"Aghya Bhuyan",             portfolio:"Social Service & Welfare Secretary",  position:"Social Service & Welfare Secretary",   sem:4, branch:"Civil",               agendaType:"Social Service & Welfare" },
  { firstName:"gunjan",     name:"Gunjan Gogoi",              portfolio:"Boys' Common Room Secretary",         position:"Boys' Common Room Secretary",          sem:6, branch:"Computer Sc & Engg.",  agendaType:"Boys' Common Room" },
  { firstName:"shruti",     name:"Shruti Deka",               portfolio:"Girls' Common Room Secretary",        position:"Girls' Common Room Secretary",         sem:6, branch:"Civil",               agendaType:"Girls' Common Room" },
];

/* ─ render cards ─ */
function renderCards(filter) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  candidates.forEach((c, idx) => {
    if (filter !== 'all' && c.branch !== filter) return;
    const div = document.createElement('div');
    div.className = 'candidate-card visible';
    div.setAttribute('tabindex', '0');
    div.innerHTML = `
      <div class="card-top">
        <div class="card-info">
          <div class="card-role">${c.portfolio}</div>
          <div class="card-position">${c.position}</div>
        </div>
        <div class="card-photo-wrap">${photoInner(c.firstName, c.name)}</div>
      </div>
      <div class="card-name">${c.name}</div>
      <div class="card-meta">
        <span class="tag sem">Sem ${c.sem}</span>
        <span class="tag">${c.branch}</span>
      </div>
      <div class="click-hint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        View Profile &amp; Agenda
      </div>`;
    div.addEventListener('click', () => openModal(idx));
    div.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openModal(idx); });
    grid.appendChild(div);
  });
}

renderCards('all');

document.getElementById('filterBar').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  renderCards(e.target.dataset.filter);
});

/* ─ modal ─ */
const overlay = document.getElementById('candidateModal');

function openModal(idx) {
  const c = candidates[idx];
  document.getElementById('modalPhotoWrap').innerHTML = photoInner(c.firstName, c.name);
  document.getElementById('modalName').textContent = c.name;
  document.getElementById('modalPosition').textContent = c.position;
  document.getElementById('modalSem').textContent = 'Semester ' + c.sem;
  document.getElementById('modalBranch').textContent = c.branch;
  document.getElementById('modalAgenda').innerHTML =
    `<p>Hi, I am <strong>${c.name}</strong>, from the ${c.branch} department, running for the position of ${c.position}. My primary goals for this term are:</p>` +
    agendaHtml(c.agendaType);
  overlay.classList.add('active');
  document.body.classList.add('modal-open');
  document.getElementById('closeBtn').focus();
}

function closeModal() {
  overlay.classList.remove('active');
  document.body.classList.remove('modal-open');
}

document.getElementById('closeBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
